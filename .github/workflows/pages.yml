name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publication sur la branche gh-pages : sa création active automatiquement
# GitHub Pages, sans configuration manuelle ni API d'administration.
permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          enable_jekyll: false
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'
      - run: echo "✅ Publié sur https://gastonfolio.github.io/cyber-csft-academy/"
